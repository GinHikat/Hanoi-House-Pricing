<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Estimator</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Calibri&family=Tw+Cent+MT&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Calibri', sans-serif;
            margin: 0;
            padding: 0;
            background: url('https://images.pexels.com/photos/1732414/pexels-photo-1732414.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0px 0px 15px rgba(255, 255, 255, 0.4);
            max-width: 650px;
            font-family: 'Calibri', sans-serif;
            text-align: left;
        }
        .header {
            position: absolute;
            top: 0;
            width: 100%;
            padding: 10px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: 'Tw Cent MT', sans-serif;
            font-size: 1.8em;
            font-weight: bold;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-family: 'Tw Cent MT', sans-serif;
        }
        p {
            font-size: 1.3em;
            margin-bottom: 30px;
            font-family: 'Calibri', sans-serif;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin: 15px 0;
        }
        .input-container input {
            font-family: 'Caveat Brush', cursive;
            font-size: 1.3em;
            padding: 12px 20px;
            margin: 5px 0;
            border: 2px solid white;
            border-radius: 30px;
            width: 85%;
            background-color: white;
            color: black;
            text-align: center;
        }
        .input-container input:focus {
            outline: none;
            border-color: #27ae60;
        }
        .arrow-btn {
            font-family: 'Caveat Brush', cursive; /* Set the font to Caveat Brush */
            font-size: 2.5em; /* Increase size */
            color: white;
            background: #007bff; /* Blue background */
            border: 2px solid white; /* White border */
            cursor: pointer;
            padding: 15px 25px;
            border-radius: 50%;
            transition: background-color 0.3s ease;
            margin-top: 15px;
            width: 90px;
            height: 90px;
        }
        .arrow-btn:hover {
            background-color: #0056b3; /* Darker blue on hover */
        }
        form {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="header">
        Machine Learning Project – Group 3
    </div>
    
    <div class="container">
        <h1>How much is my home worth?</h1>
        <p>Your Home, Your Price—Precisely Calculated for You!</p>
        
        <form method="POST" action="/">
            <div class="input-container">
                <input type="text" name="name" placeholder="Enter your name" required>
                <input type="number" name="age" placeholder="Enter your age" required>
                <button type="submit" class="arrow-btn">></button> <!-- Arrow is in Caveat Brush -->
            </div>
        </form>
    </div>
</body>
</html>
